<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <div class="dashboard">
    <!-- Radar fills the entire viewport as the base layer; everything
         else floats above it as semi-transparent tiles. -->
    <div id="radar-map"></div>

    <!-- Radar progress + timestamp (passive display; play/pause and speed
         controls live in the hidden admin drawer — see "H" key) -->
    <div class="radar-controls">
      <div class="radar-progress">
        <div class="radar-progress-fill" id="radar-progress-fill"></div>
      </div>
      <span class="radar-timestamp" id="radar-timestamp">--:--</span>
    </div>

    <!-- Top-left: date/time widget, plus radar status (hidden while
         healthy — see .status-ok rule — only appears for stale/failed so
         failures stay visible per SPEC.md without cluttering the normal
         case). -->
    <div class="top-left-stack">
      <div class="datetime-widget" id="datetime-widget">--- --, --:--</div>
      <div class="panel-status status-ok" id="status-radar">
        <span class="status-dot"></span>
        <span class="status-label">Live</span>
      </div>
    </div>

    <!-- Right column: current conditions + hourly -->
    <div class="right-column">
      <div class="current-conditions" id="current-conditions">
        <div class="condition-row">
          <span class="condition-label">Loading…</span>
        </div>
      </div>
      <div class="hourly-section">
        <div class="tile-heading-row">
          <div class="panel-status status-ok" id="status-hourly">
            <span class="status-dot"></span>
            <span class="status-label">Live</span>
          </div>
        </div>
        <div class="hourly-strip" id="hourly-strip"></div>
      </div>
    </div>

    <!-- 7-day forecast: each day is its own floating tile -->
    <div class="daily-section">
      <div class="tile-heading-row">
        <div class="panel-status status-ok" id="status-daily">
          <span class="status-dot"></span>
          <span class="status-label">Live</span>
        </div>
      </div>
      <div class="daily-strip" id="daily-strip"></div>
    </div>

    <!-- Credits strip: required attribution, kept as short as possible -->
    <div class="attribution">
      <span>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors © CARTO</span>
      <span>·</span>
      <span>Radar: <a href="https://mesonet.agron.iastate.edu/" target="_blank" rel="noopener">Iowa Environmental Mesonet</a>, Iowa State University</span>
      <span>·</span>
      <span>Forecast: <a href="https://www.weather.gov/" target="_blank" rel="noopener">National Weather Service</a></span>
    </div>

    <!-- Hidden admin drawer, toggled by the "H" key. Nothing in the
         normal UI hints this exists — see the keydown listener in app.js. -->
    <div class="admin-drawer" id="admin-drawer" hidden>
      <div class="admin-drawer-header">
        <h2>Controls</h2>
        <button class="admin-close-btn" onclick="closeAdminDrawer()">×</button>
      </div>

      <section class="admin-section">
        <h3>Location</h3>
        <label class="admin-field">
          Latitude
          <input type="number" id="admin-cfg-lat" step="0.0001">
        </label>
        <label class="admin-field">
          Longitude
          <input type="number" id="admin-cfg-lon" step="0.0001">
        </label>
        <label class="admin-field">
          Radar Zoom
          <input type="number" id="admin-cfg-zoom" min="1" max="18" step="1">
        </label>
        <button class="admin-btn" onclick="saveAdminLocation()">Save &amp; Reload</button>
      </section>

      <section class="admin-section">
        <h3>Radar Playback</h3>
        <div class="admin-radar-controls">
          <button class="admin-btn" id="radar-play-btn" onclick="toggleRadarPlay()">⏸</button>
          <button class="admin-btn" id="radar-speed-down-btn" onclick="adjustRadarSpeed(-1)">−</button>
          <span class="radar-speed-readout" id="radar-speed-readout">1×</span>
          <button class="admin-btn" id="radar-speed-up-btn" onclick="adjustRadarSpeed(1)">+</button>
        </div>
      </section>

      <section class="admin-section">
        <h3>Pin Locations</h3>
        <button class="admin-btn" id="admin-pin-toggle-btn" onclick="toggleAdminPinMode()">+ Add Pin</button>
        <p class="admin-pin-hint" id="admin-pin-hint" hidden>Click the map to place a pin…</p>
        <div class="admin-pin-list" id="admin-pin-list"></div>
      </section>
    </div>
  </div>

  <script src="icons/weather-icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
